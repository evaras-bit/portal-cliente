server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Habilitar gzip para mejor rendimiento
    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript application/json;
    gzip_min_length 1000;

    # Cache para archivos estáticos (1 día)
    location ~* \.(?:html|js|css|svg|png|jpg|jpeg|gif|woff|woff2)$ {
        expires 1d;
        add_header Cache-Control "public, no-transform";
    }

    # Fallback: si no encuentra archivo, busca index.html del directorio
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Seguridad básica: no exponer versión de Nginx
    server_tokens off;

    # Headers de seguridad
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
